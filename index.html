<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stegano Challenges</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=VT323&display=swap" rel="stylesheet">
</head>
<body>
    <div class="overlay"></div>
    <div class="scanlines"></div>
    
    <main class="game-container">
        <header>
            <h1 class="glitch" data-text="Stegano Nightmares">Stegano Nightmares</h1>
            <p class="subtitle">Can you uncover the hidden truths?</p>
        </header>

        <section class="menu-container">
            <ul class="challenge-list" id="challenge-list">
                <!-- Javascript will populate this -->
            </ul>
        </section>
    </main>

    <div class="modal" id="challenge-modal">
        <div class="modal-content">
            <span class="close-btn" id="close-btn">&times;</span>
            <h2 id="modal-title">Challenge Title</h2>
            <div class="modal-body">
                <p id="modal-desc">Description goes here</p>
                <div class="modal-stats">
                    <span id="modal-difficulty">Difficulty: ???</span>
                    <span id="modal-points">Points: 0</span>
                </div>
            </div>
            <button class="action-btn">Commence</button>
        </div>
    </div>

    <!-- Audio elements for ambient and interaction sounds - using dummy sources for now -->
    <audio id="hover-sound" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3" preload="auto"></audio>
    <audio id="click-sound" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3" preload="auto"></audio>

    <script src="script.js"></script>
</body>
</html>
